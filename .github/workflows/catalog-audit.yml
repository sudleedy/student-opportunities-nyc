name: Weekly program catalog audit

on:
  push:
    branches: [main]
    paths:
      - "programs-data.js"
      - "program-taxonomy.js"
      - "program-order.js"
      - "directory-ui.js"
      - "program-search.js"
      - "index.html"
      - "tests/test_program_filters.cjs"
      - "scripts/catalog_audit.py"
      - "program-directory.html"
      - "sitemap.xml"
      - "scripts/check_program_directory.py"
      - ".github/workflows/catalog-audit.yml"
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Validate program fields, duplicates and review dates
        run: python3 scripts/catalog_audit.py
      - name: Verify program directory and sitemap links
        run: python3 scripts/check_program_directory.py
      - name: Check new topic and opportunity-type filters
        run: node --test tests/test_program_filters.cjs
