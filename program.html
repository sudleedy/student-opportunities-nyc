ning{padding:15px;background:#fff2e9;color:#643c2d;border-radius:12px;line-height:1.6;font-size:14px}.related{display:grid;gap:9px}.related a{display:block;border:1px solid #dfe5ee;border-radius:9px;padding:12px;text-decoration:none;color:#19253d;font-weight:700}.related span{display:block;font-weight:400;font-size:12px;color:#69788a;margin-top:5px}.small{font-size:13px;color:#62708a;line-height:1.5}footer{text-align:center;padding:24px;color:#76849b;border-top:1px solid #e1e6ec}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding:26px}.info{grid-template-columns:1fr}.brand img{width:245px}}a:focus-visible{outline:3px solid #f58156;outline-offset:3px}.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:#19253d}.brand .brand-icon{width:59px;height:59px;object-fit:contain}.brand-copy{display:flex;flex-direction:column;white-space:nowrap;line-height:1.05}.brand-name{font-size:15px;font-weight:800}.brand-name strong{display:block;font-size:27px;letter-spacing:1.7px}.brand-tagline{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#687789;border-top:2px solid #f08462;margin-top:2px;padding-top:5px}@media(max-width:560px){.brand .brand-icon{width:46px;height:46px}.brand-name{font-size:12px}.brand-name strong{font-size:21px}.brand-tagline{font-size:8px;letter-spacing:1px}}.brand .brand-icon{width:73px;height:66px;object-fit:contain}.brand-name{font-size:15px;line-height:1.05}.brand-name strong{font-size:23px;letter-spacing:-.7px;line-height:1.1;display:block;white-space:nowrap}.brand-name em{font-style:normal;color:#f47c24}.brand-tagline{font-size:10px;letter-spacing:1.65px}@media(max-width:560px){.brand .brand-icon{width:56px;height:52px}.brand-name{font-size:12px}.brand-name strong{font-size:18px;letter-spacing:-.45px}.brand-tagline{font-size:8.5px;letter-spacing:1px}}

@media(max-width:700px){
 .nav{flex-wrap:wrap;gap:10px;padding:12px 16px}
 .nav .brand{min-width:0;max-width:100%;white-space:normal}

<header><div class="nav"><a class="brand" href="./" aria-label="Student Opportunities NYC home"><img src="assets/student_opportunities_nyc_icon.svg?v=1" alt="Graduation cap with upward arrow" class="brand-icon"><span class="brand-copy"><span class="brand-name">Student<strong>Opportunities <em>NYC</em></strong></span><span class="brand-tagline">DISCOVER WHAT’S NEXT</span></span></a><a class="back" href="./#opportunities">← All opportunities</a></div></header>
<main class="container"><a class="return-link" id="return-to-directory" href="./#opportunities">← Back to Home</a><div id="page"><p>Loading program information…</p></div></main><footer>© <span id="year"></span> Student Opportunities NYC · Independent student project · <a href="./privacy.html">Privacy &amp; Data</a></footer>
<script src="programs-data.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const programs=window.PROGRAMS||[],id=new URLSearchParams(location.search).get('id');
let program=programs.find(o=>o.id===id);
const root=document.getElementById('page');
document.getElementById('year').textContent=new Date().getFullYear();
function renderProgram(){
if(!program){document.title="Program not found | Student Opportunities NYC";root.innerHTML='<h1>Program not found</h1><p>That program may have moved or the link may be incorrect.</p><a href="./#opportunities">Browse all opportunities →</a>'}
else {
 document.title=program.title+' | Student Opportunities NYC';
 const related=programs.filter(o=>o.id!==program.id&&o.subject===program.subject).slice(0,3);
 const field=(name,value)=>'<div><strong>'+esc(name)+'</strong><span>'+esc(value)+'</span></div>';
 root.innerHTML='<div class="crumb"><a href="./">Home</a> / <a href="./#opportunities">Opportunities</a> / '+esc(program.title)+'</div>'+
 '<div class="hero"><span class="pill">'+esc(program.type)+'</span> <span class="tag">'+esc(program.subject||'Opportunities')+'</span><h1>'+esc(program.title)+'</h1><p id="sob-program-summary">'+esc(program.summary)+'</p><p><strong>'+esc(program.org)+'</strong> · '+esc(program.location)+'</p></div>'+
 '<div class="layout"><div><section class="panel"><h2>About this program</h2><p id="sob-program-details">'+esc(program.details||program.summary)+'</p></section>'+
 '<section class="panel"><h2>Eligibility and important details</h2><div class="info">'+field('Who can apply',program.eligibility)+field('Application deadline',program.deadline)+field('Application status',program.status)+field('Cost or compensation',program.cost)+field('Location',program.location)+field('Time commitment',program.commitment)+'</div><p class="small" id="sob-deadline-note">'+esc(program.deadlineNote||'Verify the current application cutoff on the official program website.')+'</p></section>'+
 '<section class="panel"><h2>How to prepare</h2><p>'+esc(program.preparation||'Check the official website for application steps.')+'</p></section>'+
 '<section class="panel"><h2>Before you apply</h2><div class="warning">Program information can change. Always verify eligibility, dates, application status and any fees on the official organizer website. Student Opportunities NYC is independent and is not affiliated with the organization listed here.</div><p class="small">Information reviewed: <span id="sob-reviewed">'+esc(program.verified||'Date not recorded')+'</span>. This is not a live application-status check.</p></section></div>'+
 '<aside><section class="panel"><h2>Apply or learn more</h2><p style="margin-bottom:17px">'+esc(program.applicationNote||'Go to the organizer’s site for current application details.')+'</p><a class="button" target="_blank" rel="noopener noreferrer" href="'+esc(program.url)+'">Official program website ↗</a></section>'+
 '<section class="panel"><h2>Similar opportunities</h2><div class="related">'+(related.length?related.map(o=>'<a href="program.html?id='+encodeURIComponent(o.id)+'">'+esc(o.title)+'<span>'+esc(o.org)+'</span></a>').join(''):'<p class="small">Explore more programs in the directory.</p>')+'</div><p style="margin-top:16px"><a href="./#opportunities">Browse all programs →</a></p></section></aside></div>';
}
}
renderProgram();
document.addEventListener('sob-catalog-ready',()=>{
 const fresh=programs.find(p=>p.id===id)||null;
 if(fresh!==program){
  program=fresh;renderProgram();
  if(program)document.dispatchEvent(new Event('sob-detail-ready'));
 }
});
document.addEventListener('sob-programs-updated',()=>{
 if(!program)return;
 const summary=document.getElementById('sob-program-summary');
 if(summary)summary.textContent=program.summary;
 const details=document.getElementById('sob-program-details');
 if(details)details.textContent=program.details||program.summary;
 const entries=root.querySelectorAll('.info > div');
 if(entries[1])entries[1].querySelector('span').textContent=program.deadline;
 if(entries[2])entries[2].querySelector('span').textContent=program.status;
 const note=document.getElementById('sob-deadline-note');
 if(note)note.textContent=program.deadlineNote||'Verify the current application cutoff on the official program website.';
 const reviewed=document.getElementById('sob-reviewed');
 if(reviewed)reviewed.textContent=program.verified||'Date not recorded';
});
</script><script src="auth-config.js"></script><script src="site-data.js?v=2"></script><script src="program-updates.js?v=2"></script><script src="program-descriptions.js?v=2"></script><script src="beacon-store.js?v=8"></script><script src="program-tracker.js?v=3"></script><script src="report-issue.js?v=4"></script><script src="site-analytics.js?v=1"></script></body></html>
