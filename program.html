:root{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;color:#19253d;background:#f8f9fb}*{box-sizing:border-box}body{margin:0}a{color:#a84226}header{background:white;border-bottom:1px solid #e7ebf1}.nav{max-width:1080px;margin:auto;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand img{width:340px;max-width:100%;height:auto}.back{font-weight:700;text-decoration:none;white-space:nowrap}.return-link{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #d8e0eb;border-radius:10px;color:#19253d;text-decoration:none;font-weight:750;padding:12px 16px;margin-bottom:17px;box-shadow:0 3px 12px #1d376508}.return-link:hover{background:#eef3fa}.container{max-width:1080px;margin:0 auto;padding:36px 22px 70px}.crumb{color:#64748b;font-size:14px}.crumb a{color:#405675}.hero{background:linear-gradient(125deg,#19253d,#304465);border-radius:22px;padding:40px;color:white;margin:22px 0}.hero h1{font-size:clamp(29px,4.8vw,48px);margin:14px 0}.hero p{max-width:780px;line-height:1.7;color:#e3ebf9}.pill{display:inline-block;border-radius:30px;padding:7px 12px;background:#ffebe3;color:#89391e;font-size:13px;font-weight:750}.tag{display:inline-block;padding:7px 11px;border:1px solid #c1cce1;border-radius:30px;font-size:13px;margin-right:6px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 305px;gap:23px}.panel{background:white;padding:27px;border:1px solid #e1e6ee;border-radius:17px;margin-bottom:18px}.panel h2{margin:0 0 14px;font-size:23px}.panel p{line-height:1.75;color:#44536c;margin:0}.info{display:grid;grid-template-columns:1fr 1fr;gap:15px}.info>div{padding:14px;background:#f7f8fc;border-radius:10px}.info strong{display:block;color:#64748b;font-size:12px;margin-bottom:7px}.info span{line-height:1.5;font-size:14px}.button{display:block;padding:14px;text-align:center;text-decoration:none;font-weight:800;border-radius:10px;background:#19253d;color:white!important}.button:hover{background:#34496d}.warning{padding:15px;background:#fff2e9;color:#643c2d;border-radius:12px;line-height:1.6;font-size:14px}.related{display:grid;gap:9px}.related a{display:block;border:1px solid #dfe5ee;border-radius:9px;padding:12px;text-decoration:none;color:#19253d;font-weight:700}.related span{display:block;font-weight:400;font-size:12px;color:#69788a;margin-top:5px}.small{font-size:13px;color:#62708a;line-height:1.5}footer{text-align:center;padding:24px;color:#76849b;border-top:1px solid #e1e6ec}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding:26px}.info{grid-template-columns:1fr}.brand img{width:245px}}a:focus-visible{outline:3px solid #f58156;outline-offset:3px}.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:#19253d}.brand .brand-icon{width:59px;height:59px;object-fit:contain}.brand-copy{display:flex;flex-direction:column;white-space:nowrap;line-height:1.05}.brand-name{font-size:15px;font-weight:800}.brand-name strong{display:block;font-size:27px;letter-spacing:1.7px}.brand-tagline{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#687789;border-top:2px solid #f08462;margin-top:2px;padding-top:5px}@media(max-width:560px){.brand .brand-icon{width:46px;height:46px}.brand-name{font-size:12px}.brand-name strong{font-size:21px}.brand-tagline{font-size:8px;letter-spacing:1px}}.brand .brand-icon{width:73px;height:66px;object-fit:contain}.brand-name{font-size:15px;line-height:1.05}.brand-name strong{font-size:23px;letter-spacing:-.7px;line-height:1.1;display:block;white-space:nowrap}.brand-name em{font-style:normal;color:#f47c24}.brand-tagline{font-size:10px;letter-spacing:1.65px}@media(max-width:560px){.brand .brand-icon{width:56px;height:52px}.brand-name{font-size:12px}.brand-name strong{font-size:18px;letter-spacing:-.45px}.brand-tagline{font-size:8.5px;letter-spacing:1px}}
/* Phone-width program detail and navigation safeguards. */
.hero h1,.panel,.info span,.related a,.crumb{overflow-wrap:anywhere}
@media(max-width:700px){
 .nav{flex-wrap:wrap;gap:10px;padding:12px 16px}
 .nav .brand{min-width:0;max-width:100%;white-space:normal}
 .nav .brand-copy{min-width:0;white-space:normal}
 .nav .back{margin-left:auto;min-height:44px;display:inline-flex;align-items:center}
 .container{padding:24px 16px 55px}
 .hero{padding:24px 20px;border-radius:15px}
 .panel{padding:20px}
 .layout,.info{grid-template-columns:minmax(0,1fr)}
 .return-link,.button{min-height:44px}
}
@media(max-width:360px){
 .brand .brand-icon{width:42px;height:40px}
 .brand-name strong{font-size:16px}
 .brand-tagline{font-size:8px;letter-spacing:.4px}
 .panel{padding:16px}
}
.source-evidence{margin-top:13px!important;padding:14px 16px;border-left:3px solid #8296b5;background:#f4f7fb;border-radius:8px;font-size:14px;line-height:1.65;color:#394d69!important;overflow-wrap:anywhere}
.activity-panel{border-left:4px solid #e08d62;background:#fffaf6}.activity-panel h2{color:#713d27}.activity-panel p{overflow-wrap:anywhere}.activity-panel .small{margin-top:12px;color:#6f7a8a;font-size:12px}
</style></head><body>
<header><div class="nav"><a class="brand" href="./" aria-label="Student Opportunities NYC home"><img src="assets/student_opportunities_nyc_icon.svg?v=1" alt="Graduation cap with upward arrow" class="brand-icon"><span class="brand-copy"><span class="brand-name">Student<strong>Opportunities <em>NYC</em></strong></span><span class="brand-tagline">DISCOVER WHAT’S NEXT</span></span></a><a class="back" href="./#opportunities">← All opportunities</a></div></header>
<main class="container"><a class="return-link" id="return-to-directory" href="./#opportunities">← Back to Home</a><div id="page"><p>Loading program information…</p></div></main><footer>© <span id="year"></span> Student Opportunities NYC · Independent student project · <a href="./privacy.html">Privacy &amp; Data</a></footer>
<script src="programs-data.js?v=12"></script><script>
const officialUrl=raw=>{try{const u=new URL(raw);return u.protocol==='https:'?u.href:null}catch{return null}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const programs=window.PROGRAMS||[],id=new URLSearchParams(location.search).get('id');
let program=programs.find(o=>o.id===id);
const root=document.getElementById('page');
document.getElementById('year').textContent=new Date().getFullYear();
/* Restore the directory search when returning from a program detail page. */
function directoryReturnHref(){
 const valid=raw=>{
  try{
   const u=new URL(raw,location.origin);
   return u.origin===location.origin&&['/','/index.html'].includes(u.pathname)
    ?u.pathname+u.search+'#opportunities':null;
  }catch{return null}
 };
 const ref=valid(document.referrer);
 if(ref)return ref;
 try{
  const stored=JSON.parse(sessionStorage.getItem('sob-directory-return-v1')||'null');
  if(stored&&Number.isFinite(stored.savedAt)&&Date.now()-stored.savedAt<3600000&&Date.now()>=stored.savedAt){
   return valid(stored.url)||'./#opportunities';
  }
 }catch{}
 return './#opportunities';
}
const returnHref=directoryReturnHref();
document.querySelectorAll('a.back,#return-to-directory').forEach(link=>link.href=returnHref);

const siteBase='https://student-opportunities-nyc.com/';
function setMeta(selector,attribute,value,content){
 let tag=document.head.querySelector(selector);
 if(!tag){tag=document.createElement('meta');tag.setAttribute(attribute,value);document.head.appendChild(tag)}
 tag.setAttribute('content',content);
}
function syncSearchMetadata(){
 const usable=Boolean(program);
 const title=usable?program.title+' | Student Opportunities NYC':'Program not found | Student Opportunities NYC';
 const description=usable?String(program.whatYouDo||program.summary||program.details||'').replace(/\s+/g,' ').trim().slice(0,155):
   'Explore verified educational opportunities and student programs in New York City.';
 const url=usable?siteBase+'program.html?id='+encodeURIComponent(program.id):siteBase;
 document.title=title;
 setMeta('meta[name="description"]','name','description',description);
 setMeta('meta[name="robots"]','name','robots',usable?'index,follow':'noindex,follow');
 setMeta('meta[property="og:title"]','property','og:title',title);
 setMeta('meta[property="og:description"]','property','og:description',description);
 setMeta('meta[property="og:url"]','property','og:url',url);
 let canonical=document.head.querySelector('link[rel="canonical"]');
 if(!canonical){canonical=document.createElement('link');canonical.rel='canonical';document.head.appendChild(canonical)}
 canonical.href=url;
 const old=document.getElementById('sob-structured-data');if(old)old.remove();
 if(usable){
  const ld=document.createElement('script');ld.id='sob-structured-data';ld.type='application/ld+json';
  ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'WebPage',name:program.title,
   url,description,about:{'@type':'EducationalOrganization',name:program.org||'Program organizer'},
   isPartOf:{'@type':'WebSite',name:'Student Opportunities NYC',url:siteBase}});
  document.head.appendChild(ld);
 }
}

const deadlinePassed=p=>/^\d{4}-\d{2}-\d{2}$/.test(p.deadlineISO||'')&&new Date(p.deadlineISO+'T23:59:59').getTime()<Date.now();
const deadlineForDisplay=p=>deadlinePassed(p)&&!/last published deadline|\bpassed\b/i.test(p.deadline||'')?'Last published deadline: '+p.deadline+' (passed; next cycle unconfirmed)':p.deadline;
const statusForDisplay=p=>deadlinePassed(p)&&(['open','upcoming'].includes(p.applicationState)||/applications? (?:are )?open|accepting applications|apply now/i.test(p.status||''))?'The listed application deadline has passed. Check the organizer for an extension or the next cycle.':p.status;
function renderProgram(){
 syncSearchMetadata();
if(!program){document.title="Program not found | Student Opportunities NYC";root.innerHTML='<h1>Program not found</h1><p>That program may have moved or the link may be incorrect.</p><a href="./#opportunities">Browse all opportunities →</a>'}
else {
 document.title=program.title+' | Student Opportunities NYC';
 const related=programs.filter(o=>o.id!==program.id&&o.subject===program.subject).slice(0,3);
 const field=(name,value)=>'<div><strong>'+esc(name)+'</strong><span>'+esc(value)+'</span></div>';
 root.innerHTML='<div class="crumb"><a href="./">Home</a> / <a href="./#opportunities">Opportunities</a> / '+esc(program.title)+'</div>'+
 '<div class="hero"><span class="pill">'+esc(program.type)+'</span> <span class="tag">'+esc(program.subject||'Opportunities')+'</span><h1>'+esc(program.title)+'</h1><p id="sob-program-summary">'+esc(program.summary)+'</p><p><strong>'+esc(program.org)+'</strong> · '+esc(program.location)+'</p></div>'+
 '<div class="layout"><div><section class="panel activity-panel"><h2>What you’ll actually do</h2><p id="sob-program-activities">'+esc(program.whatYouDo||program.summary)+'</p><p class="small">Actual activities depend on the placement, cohort and organizer.</p></section><section class="panel"><h2>About this program</h2><p id="sob-program-details">'+esc(program.details||program.summary)+'</p></section>'+
 '<section class="panel"><h2>Eligibility and important details</h2><div class="info">'+field('Who can apply',program.eligibility)+field('Application deadline',deadlineForDisplay(program))+field('Application status',statusForDisplay(program))+field('Cost or compensation',program.cost)+field('Location',program.location)+field('Time commitment',program.commitment)+'</div><p class="small" id="sob-deadline-note">'+esc(program.deadlineNote||'Verify the current application cutoff on the official program website.')+'</p></section>'+
 '<section class="panel"><h2>How to prepare</h2><p>'+esc(program.preparation||'Check the official website for application steps.')+'</p></section>'+
 '<section class="panel"><h2>Before you apply</h2><div class="warning">Program information can change. Always verify eligibility, dates, application status and any fees on the official organizer website. Student Opportunities NYC is independent and is not affiliated with the organization listed here.</div><p class="small">Organizer source review: <strong id="sob-source-status">'+esc(program.sourceStatus==='current'?'Current or recent cycle information checked':program.sourceStatus==='program'?'Program existence checked; dates unconfirmed':'Current enrollment not verified')+'</strong>. Checked <span id="sob-reviewed">'+esc(program.sourceChecked||program.verified||'Date not recorded')+'</span>. This is not a live application-status check.</p><p class="source-evidence" id="sob-source-note">'+esc(program.sourceNote||'No current organizer verification note available; confirm the full details independently.')+'</p></section></div>'+
 '<aside><section class="panel"><h2>Apply or learn more</h2><p id="sob-program-application-note" style="margin-bottom:17px">'+esc(program.applicationNote||'Go to the organizer’s site for current application details.')+'</p>'+(officialUrl(program.url)?'<a id="sob-program-official-link" class="button" target="_blank" rel="noopener noreferrer" href="'+esc(officialUrl(program.url))+'">Official program website ↗</a>':'<p id="sob-program-invalid-link" class="warning">Official link needs verification before opening.</p>')+'</section>'+
 '<section class="panel"><h2>Similar opportunities</h2><div class="related">'+(related.length?related.map(o=>'<a href="program.html?id='+encodeURIComponent(o.id)+'">'+esc(o.title)+'<span>'+esc(o.org)+'</span></a>').join(''):'<p class="small">Explore more programs in the directory.</p>')+'</div><p style="margin-top:16px"><a href="./#opportunities">Browse all programs →</a></p></section></aside></div>';
}
}
renderProgram();
document.addEventListener('sob-catalog-ready',()=>{
 const fresh=programs.find(p=>p.id===id)||null;
 if(fresh!==program){
  program=fresh;renderProgram();
  if(program)document.dispatchEvent(new Event('sob-detail-ready'));
 }
});
document.addEventListener('sob-programs-updated',()=>{
 const newest=programs.find(p=>p.id===id)||null;
 if(!newest){
  program=null;renderProgram();return;
 }
 if(!program){program=newest;renderProgram();document.dispatchEvent(new Event('sob-detail-ready'));return}
 program=newest;
 syncSearchMetadata();
 const headline=root.querySelector('.hero h1');
 if(headline)headline.textContent=program.title;
 const crumb=root.querySelector('.crumb');
 if(crumb)crumb.lastChild.textContent=' / '+program.title;
 const pill=root.querySelector('.hero .pill');if(pill)pill.textContent=program.type;
 const subject=root.querySelector('.hero .tag');if(subject)subject.textContent=program.subject||'Opportunities';
 const meta=root.querySelector('.hero p strong');
 if(meta&&meta.parentElement)meta.parentElement.textContent=(program.org||'')+' · '+(program.location||'');
 const intro=root.querySelector('.panel p#sob-program-application-note');
 if(intro)intro.textContent=program.applicationNote||'Go to the organizer’s site for current application details.';
 const targetLink=document.getElementById('sob-program-official-link');
 if(targetLink&&officialUrl(program.url))targetLink.href=officialUrl(program.url);
 else if(targetLink&&!officialUrl(program.url)){targetLink.removeAttribute('href');targetLink.textContent='Official link needs verification';}
 const about=root.querySelector('.layout > div > .panel:nth-of-type(4) p');
 if(about)about.textContent=program.preparation||'Check the official website for application steps.';
 const summary=document.getElementById('sob-program-summary');
 if(summary)summary.textContent=program.summary;
 const details=document.getElementById('sob-program-details');
 if(details)details.textContent=program.details||program.summary;
 const activities=document.getElementById('sob-program-activities');if(activities)activities.textContent=program.whatYouDo||program.summary;
 const entries=root.querySelectorAll('.info > div');
 if(entries[1])entries[1].querySelector('span').textContent=program.deadline;
 if(entries[2])entries[2].querySelector('span').textContent=program.status;
 const values=[program.eligibility,deadlineForDisplay(program),statusForDisplay(program),program.cost,program.location,program.commitment];
 entries.forEach((entry,i)=>{const span=entry.querySelector('span');if(span)span.textContent=values[i]||'Not confirmed'});
 const note=document.getElementById('sob-deadline-note');
 if(note)note.textContent=program.deadlineNote||'Verify the current application cutoff on the official program website.';
 const reviewed=document.getElementById('sob-reviewed');
 if(reviewed)reviewed.textContent=program.sourceChecked||program.verified||'Date not recorded';
 const sourceStatus=document.getElementById('sob-source-status');
 if(sourceStatus)sourceStatus.textContent=program.sourceStatus==='current'?'Current or recent cycle information checked':program.sourceStatus==='program'?'Program existence checked; dates unconfirmed':'Current enrollment not verified';
 const sourceNote=document.getElementById('sob-source-note');
 if(sourceNote)sourceNote.textContent=program.sourceNote||'No current organizer verification note available; confirm the full details independently.';
});
</script><script src="auth-config.js"></script><script src="site-data.js?v=4"></script><script src="program-updates.js?v=2"></script><script src="program-descriptions.js?v=2"></script><script src="beacon-store.js?v=12"></script><script src="program-tracker.js?v=6"></script><script src="report-issue.js?v=4"></script><script src="site-analytics.js?v=1"></script></body></html>
